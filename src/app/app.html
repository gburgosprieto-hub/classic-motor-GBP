<header class="cabecera">
  <button
    class="cabecera__boton"
    type="button"
    aria-controls="menu-principal"
    [attr.aria-expanded]="menuAbierto()"
    (click)="alternarMenu()"
  >
    Menú
  </button>

  <nav
    class="cabecera__nav"
    id="menu-principal"
    aria-label="Navegación principal"
    [class.cabecera__nav--abierto]="menuAbierto()"
  >
    <a class="cabecera__enlace" routerLink="/inicio" routerLinkActive="cabecera__enlace--activo">Inicio</a>
    <a class="cabecera__enlace" routerLink="/catalogo" routerLinkActive="cabecera__enlace--activo">Catálogo</a>
    <a class="cabecera__enlace" routerLink="/itinerario" routerLinkActive="cabecera__enlace--activo">Itinerario</a>
    <a class="cabecera__enlace" routerLink="/inscripcion" routerLinkActive="cabecera__enlace--activo">Inscripción</a>
    <a class="cabecera__enlace" routerLink="/guia-estilo" routerLinkActive="cabecera__enlace--activo">Guía de estilo</a>
  </nav>
</header>

<main class="contenido-principal">
  <router-outlet />
</main>

<footer class="pie">
  <p class="pie__texto">Rally Classic Motor Club 2</p>
</footer>
